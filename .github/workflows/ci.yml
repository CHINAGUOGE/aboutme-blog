# ============================================================
# CI Pipeline — 果鸽博客
#
# 触发条件：
#   - push 到 main / dev 分支
#   - Pull Request 到 main
#
# Jobs:
#   1. lint     — 代码校验
#   2. build    — 构建验证
#   3. deploy   — 部署到 Cloudflare Pages（仅 main）
# ============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# 取消同一分支上的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ============================================================
  # Job 1: 代码校验
  # ============================================================
  lint:
    name: 🔍 Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Validate site config
        run: pnpm validate-config

      - name: 🔍 Validate TypeScript
        run: pnpm astro check 2>&1 || true

      - name: 📏 Check file sizes
        run: |
          echo "📊 Large files check:"
          find src -type f -size +500k -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $9}' || echo "  ✅ No large files"

  # ============================================================
  # Job 2: 构建验证
  # ============================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Extract theme colors
        run: pnpm tsx scripts/color-extract.ts || echo "Using default theme"

      - name: 🖼️ Optimize assets
        run: pnpm tsx scripts/optimize-assets.mjs || echo "No assets to optimize"

      - name: 🔨 Build site
        run: pnpm astro build

      - name: 🔍 Generate search index
        run: npx pagefind --site dist || echo "Pagefind indexing failed"

      - name: ✅ Verify build output
        run: |
          echo "📁 Build output:"
          ls -la dist/
          echo ""
          echo "📊 File counts:"
          echo "  HTML: $(find dist -name '*.html' | wc -l)"
          echo "  JS:   $(find dist -name '*.js' | wc -l)"
          echo "  CSS:  $(find dist -name '*.css' | wc -l)"
          echo ""
          echo "📦 Total size:"
          du -sh dist/

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================================
  # Job 3: 部署到 Cloudflare Pages（仅 main 分支）
  # ============================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=guogepige-blog

      - name: ✅ Deployment summary
        run: |
          echo "🚀 Deployed successfully!"
          echo "  🌐 URL: ${{ steps.deploy.outputs.url }}"
          echo "  📦 Environment: production"
