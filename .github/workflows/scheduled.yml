# ============================================================
# Scheduled Tasks — 定时任务
#
# - 每周一检查依赖更新
# - 每月重建一次（确保构建环境正常）
# ============================================================

name: Scheduled

on:
  schedule:
    # 每周一 UTC 00:00（北京时间 08:00）
    - cron: "0 0 * * 1"
  workflow_dispatch: # 允许手动触发

jobs:
  # ============================================================
  # 依赖安全检查
  # ============================================================
  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔒 Run audit
        run: pnpm audit --prod || true

      - name: 📊 Audit report
        if: always()
        run: |
          echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          pnpm audit --prod >> $GITHUB_STEP_SUMMARY 2>&1 || true

  # ============================================================
  # 完整构建测试
  # ============================================================
  rebuild:
    name: 🔨 Full Rebuild Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Full build
        run: bash build.sh --ci

      - name: 📊 Build report
        if: always()
        run: |
          echo "## 🔨 Rebuild Test" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "✅ Build succeeded" >> $GITHUB_STEP_SUMMARY
            echo "Pages: $(find dist -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "Size: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
